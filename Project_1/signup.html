<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - MNTN</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <a href="index.html" class="back-btn">
      <span>←</span> Back to Home
  </a>

  <div class="login-page">
    <div class="login-box">
      <h2>Create your account</h2>
      <p class="auth-subtitle">Join the community and start exploring.</p>

      <form class="login-form" id="signupForm" novalidate>

        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter your full name">
        <span class="error-msg" id="nameError"></span>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email">
        <span class="error-msg" id="emailError"></span>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create a password">
        <span class="error-msg" id="passwordError"></span>

        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Re-enter your password">
        <span class="error-msg" id="confirmPasswordError"></span>

        <button type="submit" class="login-btn">Create Account</button>

        <p class="success-msg" id="successMsg"></p>
      </form>

      <p class="signup-link">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
